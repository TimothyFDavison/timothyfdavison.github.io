<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: "en" }}">

  <link rel="stylesheet" href="{{ '/main.css' | relative_url }}">
  <div class="wrapper">

  {% include head.html %}

  <body>

    {% include header.html %}

    <main class="page-content" aria-label="Content">
      <div class="wrapper">
        {{ content }}
      </div>
    </main>

  </body>
  </div>

  <footer class="site-footer" style="width: 100%; max-width: 100vw; margin: 0; padding: 0; box-sizing: border-box;">
    <div class="footer-content" style="text-align: center; padding: 20px; background-color: #f8f9fa;">
      <p style="margin: 0; color: #6c757d;">&copy; {{ site.time | date: '%Y' }} {{ site.title }}, contact via LinkedIn.</p>
    </div>
</footer>

</html>
